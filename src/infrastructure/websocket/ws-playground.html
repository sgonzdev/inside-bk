<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>WebSocket Playground</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: monospace; background: #0f0f0f; color: #e0e0e0; display: flex; flex-direction: column; height: 100vh; }
    header { background: #1a1a2e; padding: 16px 24px; border-bottom: 1px solid #333; display: flex; align-items: center; gap: 16px; }
    header h1 { font-size: 1rem; color: #7c83ff; }
    #status { font-size: 0.75rem; padding: 3px 10px; border-radius: 999px; background: #333; color: #888; }
    #status.connected { background: #1a3a1a; color: #4caf50; }
    #status.error { background: #3a1a1a; color: #f44336; }

    main { display: flex; flex: 1; overflow: hidden; }

    /* Left panel - controls */
    aside { width: 320px; min-width: 320px; border-right: 1px solid #222; display: flex; flex-direction: column; overflow-y: auto; }
    section { padding: 16px; border-bottom: 1px solid #222; }
    section h2 { font-size: 0.7rem; text-transform: uppercase; color: #666; letter-spacing: 1px; margin-bottom: 10px; }
    label { display: block; font-size: 0.75rem; color: #aaa; margin-bottom: 4px; margin-top: 8px; }
    input, textarea { width: 100%; background: #1a1a1a; border: 1px solid #333; color: #e0e0e0; padding: 7px 10px; border-radius: 4px; font-family: monospace; font-size: 0.8rem; }
    input:focus, textarea:focus { outline: none; border-color: #7c83ff; }
    textarea { resize: vertical; min-height: 60px; }
    button { margin-top: 10px; width: 100%; padding: 8px; border: none; border-radius: 4px; cursor: pointer; font-family: monospace; font-size: 0.8rem; font-weight: bold; }
    .btn-primary { background: #7c83ff; color: #fff; }
    .btn-primary:hover { background: #5c63df; }
    .btn-danger { background: #c0392b; color: #fff; }
    .btn-danger:hover { background: #a93226; }
    .btn-secondary { background: #2a2a2a; color: #aaa; border: 1px solid #444; }
    .btn-secondary:hover { background: #333; }

    /* Right panel - log */
    #log-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    #log-header { padding: 10px 16px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
    #log-header span { font-size: 0.7rem; text-transform: uppercase; color: #666; letter-spacing: 1px; }
    #log { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; }
    .log-entry { font-size: 0.78rem; padding: 6px 10px; border-radius: 4px; border-left: 3px solid #444; word-break: break-all; }
    .log-entry .time { color: #555; font-size: 0.7rem; margin-right: 8px; }
    .log-entry.info { border-color: #7c83ff; background: #12121f; }
    .log-entry.recv { border-color: #4caf50; background: #0f1f0f; }
    .log-entry.sent { border-color: #ff9800; background: #1f160f; }
    .log-entry.err  { border-color: #f44336; background: #1f0f0f; }
  </style>
</head>
<body>

<header>
  <h1>⚡ WebSocket Playground</h1>
  <span id="status">disconnected</span>
</header>

<main>
  <aside>

    <!-- Connection -->
    <section>
      <h2>Conexión</h2>
      <label>Access Token (JWT)</label>
      <textarea id="token" rows="3" placeholder="Pega aquí tu access token..."></textarea>
      <button class="btn-primary" onclick="connect()">Conectar</button>
      <button class="btn-danger" onclick="disconnect()" style="margin-top:6px">Desconectar</button>
    </section>

    <!-- Join room -->
    <section>
      <h2>Join Room</h2>
      <label>Room ID</label>
      <input id="join-room" placeholder="uuid de la sala" />
      <button class="btn-secondary" onclick="emit('join-room', { roomId: document.getElementById('join-room').value })">Enviar join-room</button>
    </section>

    <!-- Send message -->
    <section>
      <h2>Enviar mensaje</h2>
      <label>Room ID</label>
      <input id="msg-room" placeholder="uuid de la sala" />
      <label>Contenido</label>
      <input id="msg-content" placeholder="Hola mundo" />
      <button class="btn-secondary" onclick="emit('send-message', { roomId: document.getElementById('msg-room').value, content: document.getElementById('msg-content').value })">Enviar send-message</button>
    </section>

    <!-- Custom event -->
    <section>
      <h2>Evento personalizado</h2>
      <label>Evento</label>
      <input id="custom-event" placeholder="nombre-del-evento" />
      <label>Payload (JSON)</label>
      <textarea id="custom-payload" rows="3" placeholder='{"key": "value"}'></textarea>
      <button class="btn-secondary" onclick="emitCustom()">Emitir</button>
    </section>

  </aside>

  <div id="log-panel">
    <div id="log-header">
      <span>Event Log</span>
      <button class="btn-secondary" style="width:auto;padding:4px 12px;margin:0" onclick="clearLog()">Limpiar</button>
    </div>
    <div id="log"></div>
  </div>
</main>

<script>
  let socket = null;

  function log(msg, type = 'info') {
    const el = document.createElement('div');
    el.className = `log-entry ${type}`;
    const now = new Date().toLocaleTimeString();
    const content = typeof msg === 'object' ? JSON.stringify(msg, null, 2) : msg;
    el.innerHTML = `<span class="time">${now}</span>${content}`;
    const container = document.getElementById('log');
    container.appendChild(el);
    container.scrollTop = container.scrollHeight;
  }

  function setStatus(text, cls) {
    const s = document.getElementById('status');
    s.textContent = text;
    s.className = cls;
  }

  function connect() {
    const token = document.getElementById('token').value.trim();
    if (!token) { log('⚠ Ingresa un token JWT', 'err'); return; }
    if (socket?.connected) { log('Ya conectado', 'info'); return; }

    log('Conectando...', 'info');
    socket = io(window.location.origin, {
      auth: { token },
      transports: ['websocket'],
    });

    socket.on('connect', () => {
      setStatus('connected · ' + socket.id, 'connected');
      log(`✅ Conectado — socket.id: ${socket.id}`, 'info');
    });

    socket.on('disconnect', (reason) => {
      setStatus('disconnected', '');
      log(`🔌 Desconectado: ${reason}`, 'err');
    });

    socket.on('connect_error', (err) => {
      setStatus('error', 'error');
      log(`❌ Error de conexión: ${err.message}`, 'err');
    });

    // Escucha todos los eventos entrantes
    socket.onAny((event, ...args) => {
      log(`← [${event}] ${JSON.stringify(args)}`, 'recv');
    });
  }

  function disconnect() {
    socket?.disconnect();
    socket = null;
    setStatus('disconnected', '');
  }

  function emit(event, payload) {
    if (!socket?.connected) { log('⚠ No conectado', 'err'); return; }
    socket.emit(event, payload);
    log(`→ [${event}] ${JSON.stringify(payload)}`, 'sent');
  }

  function emitCustom() {
    const event = document.getElementById('custom-event').value.trim();
    const raw = document.getElementById('custom-payload').value.trim();
    if (!event) { log('⚠ Escribe el nombre del evento', 'err'); return; }
    let payload = {};
    try { if (raw) payload = JSON.parse(raw); } catch { log('⚠ Payload JSON inválido', 'err'); return; }
    emit(event, payload);
  }

  function clearLog() {
    document.getElementById('log').innerHTML = '';
  }
</script>

</body>
</html>

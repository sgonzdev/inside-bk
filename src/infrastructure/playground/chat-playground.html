<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat — InsideOut</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0f1117;color:#e2e8f0;font-family:system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
    header{background:#1a1d27;border-bottom:1px solid #2a2d3a;padding:12px 20px;display:flex;align-items:center;justify-content:space-between}
    header h1{font-size:1rem;color:#34d399;font-weight:700}
    .badge{font-size:11px;padding:2px 10px;border-radius:12px;background:#2a2d3a;color:#64748b}
    .badge.online{background:#064e3b;color:#34d399}

    .auth-bar{background:#12151f;border-bottom:1px solid #2a2d3a;padding:8px 20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .auth-bar input{flex:1;min-width:200px;background:#1a1d27;border:1px solid #2a2d3a;color:#e2e8f0;padding:7px 12px;border-radius:6px;font-size:12px}
    .auth-bar input:focus{outline:none;border-color:#34d399}
    .btn{padding:7px 14px;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600}
    .btn-green{background:#065f46;color:#34d399}.btn-green:hover{background:#047857}
    .btn-gray{background:#1e2130;color:#94a3b8;border:1px solid #2a2d3a}.btn-gray:hover{background:#2a2d3a}

    main{display:flex;flex:1;overflow:hidden}

    /* Rooms */
    .rooms-panel{width:260px;min-width:260px;border-right:1px solid #2a2d3a;display:flex;flex-direction:column}
    .panel-header{padding:10px 14px;border-bottom:1px solid #2a2d3a}
    .panel-header span{font-size:11px;text-transform:uppercase;color:#64748b;letter-spacing:1px}
    .room-list{flex:1;overflow-y:auto}
    .room-item{padding:10px 14px;border-bottom:1px solid #1e2130;cursor:pointer;transition:.15s}
    .room-item:hover{background:#1a1d27}
    .room-item.active{background:#0f2919;border-left:3px solid #34d399}
    .room-item-row{display:flex;justify-content:space-between;align-items:center}
    .room-name{font-size:13px;font-weight:600}
    .room-preview{font-size:11px;color:#64748b;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .unread-badge{background:#34d399;color:#0f1117;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px}
    .typing-bubble{display:none;align-self:flex-start;align-items:flex-start;flex-direction:column;max-width:70%}
    .typing-bubble.visible{display:flex}
    .typing-dots{background:#1e2130;border-radius:10px;border-bottom-left-radius:2px;padding:10px 16px;display:flex;gap:5px;align-items:center}
    .typing-dots span{width:7px;height:7px;background:#64748b;border-radius:50%;animation:blink 1.4s infinite}
    .typing-dots span:nth-child(2){animation-delay:.2s}
    .typing-dots span:nth-child(3){animation-delay:.4s}
    @keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
    .typing-who{font-size:10px;color:#64748b;margin-bottom:3px}
    .new-room-form{padding:12px;border-top:1px solid #2a2d3a;display:flex;flex-direction:column;gap:6px}
    .new-room-form input{background:#12151f;border:1px solid #2a2d3a;color:#e2e8f0;padding:7px 10px;border-radius:6px;font-size:12px}
    .new-room-form input:focus{outline:none;border-color:#34d399}

    /* Chat */
    .chat-panel{flex:1;display:flex;flex-direction:column;overflow:hidden}
    .chat-header{padding:10px 16px;border-bottom:1px solid #2a2d3a}
    .chat-header-name{font-size:14px;font-weight:600}
    .chat-header-id{font-size:10px;color:#64748b;margin-top:2px}

    #messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;scroll-behavior:auto}
    .empty-chat{color:#64748b;font-size:13px;text-align:center;padding:40px}
    .date-sep{display:flex;align-items:center;gap:8px;margin:4px 0}
    .date-sep::before,.date-sep::after{content:'';flex:1;height:1px;background:#2a2d3a}
    .date-sep span{font-size:11px;color:#64748b;white-space:nowrap;background:#0f1117;padding:0 8px;border-radius:10px;border:1px solid #2a2d3a}
    .date-jump{display:flex;align-items:center;gap:6px}
    .date-jump input[type=date]{background:#12151f;border:1px solid #2a2d3a;color:#e2e8f0;padding:4px 8px;border-radius:6px;font-size:11px;cursor:pointer}
    .date-jump input[type=date]:focus{outline:none;border-color:#34d399}
    .msg{animation:msgIn .18s ease}
    @keyframes msgIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
    .msg.prepend{animation:msgPrepend .2s ease}
    @keyframes msgPrepend{from{opacity:0}to{opacity:1}}
    .scroll-loader{display:flex;justify-content:center;padding:8px;opacity:0;transition:opacity .2s}
    .scroll-loader.visible{opacity:1}
    .scroll-loader span{width:6px;height:6px;border-radius:50%;background:#34d399;animation:blink 1s infinite}
    .scroll-loader span:nth-child(2){animation-delay:.15s}
    .scroll-loader span:nth-child(3){animation-delay:.3s}

    .msg{display:flex;flex-direction:column;max-width:70%}
    .msg.mine{align-self:flex-end;align-items:flex-end}
    .msg.theirs{align-self:flex-start;align-items:flex-start}
    .msg-sender{font-size:10px;color:#64748b;margin-bottom:3px}
    .msg-bubble{padding:8px 12px;border-radius:10px;font-size:13px;line-height:1.5;word-break:break-word}
    .msg.mine .msg-bubble{background:#065f46;color:#d1fae5;border-bottom-right-radius:2px}
    .msg.theirs .msg-bubble{background:#1e2130;color:#e2e8f0;border-bottom-left-radius:2px}
    .msg-footer{font-size:10px;color:#64748b;margin-top:3px;display:flex;align-items:center;gap:4px}
    .tick{font-size:13px;line-height:1}
    .tick.sent{color:#64748b}       /* ✓  gris — enviado */
    .tick.delivered{color:#64748b}  /* ✓✓ gris — entregado (sin leer) */
    .tick.read{color:#34d399}       /* ✓✓ verde — leído */
    .msg-media{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
    .msg-media img{max-width:200px;max-height:150px;border-radius:6px;object-fit:cover;cursor:pointer}
    .msg-media video{max-width:200px;border-radius:6px}
    .msg-audio{margin-top:6px}.msg-audio audio{border-radius:20px;height:36px;min-width:200px}
    .msg-docs{display:flex;flex-direction:column;gap:4px;margin-top:6px}
    .msg-doc{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.2);border-radius:8px;padding:8px 12px;text-decoration:none;color:inherit;font-size:12px;border:1px solid #2a2d3a}
    .msg-doc:hover{border-color:#34d399}
    .msg-doc-icon{font-size:20px}
    .msg-doc-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
    .msg-doc-size{color:#64748b;white-space:nowrap}

    /* Input */
    .input-area{border-top:1px solid #2a2d3a;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
    .file-preview-bar{display:flex;flex-wrap:wrap;gap:6px}
    .file-chip{background:#1e2130;border:1px solid #2a2d3a;border-radius:4px;padding:3px 8px;font-size:11px;color:#94a3b8;display:flex;align-items:center;gap:6px}
    .file-chip button{background:none;border:none;color:#f87171;cursor:pointer}
    .input-row{display:flex;gap:8px;align-items:center}
    #msg-input{flex:1;background:#12151f;border:1px solid #2a2d3a;color:#e2e8f0;padding:9px 12px;border-radius:8px;font-size:13px;font-family:inherit}
    #msg-input:focus{outline:none;border-color:#34d399}
    .attach-btn{background:#1e2130;border:1px solid #2a2d3a;color:#94a3b8;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:16px}
    .attach-btn:hover{border-color:#34d399;color:#34d399}
    .mic-btn{background:#1e2130;border:1px solid #2a2d3a;color:#94a3b8;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:16px;transition:.2s}
    .mic-btn:hover{border-color:#f87171;color:#f87171}
    .mic-btn.recording{background:#450a0a;border-color:#f87171;color:#f87171;animation:pulse 1s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    .send-btn{background:#065f46;color:#34d399;border:none;padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:700;font-size:13px}
    .send-btn:hover{background:#047857}
    .voice-preview{background:#1e2130;border:1px solid #2a2d3a;border-radius:8px;padding:8px 12px;display:flex;align-items:center;gap:8px}
    .voice-preview audio{flex:1;height:32px}
    .voice-preview button{background:none;border:none;color:#f87171;cursor:pointer;font-size:16px}

    #toast{position:fixed;bottom:20px;right:20px;background:#1e2130;border:1px solid #2a2d3a;color:#e2e8f0;padding:10px 16px;border-radius:8px;font-size:13px;display:none;z-index:999}
    #toast.ok{border-color:#34d399;color:#34d399}
    #toast.err{border-color:#f87171;color:#f87171}

    #lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;align-items:center;justify-content:center}
    #lightbox.open{display:flex}
    #lightbox img{max-width:90vw;max-height:90vh;border-radius:8px}
    #lightbox-close{position:absolute;top:16px;right:20px;background:none;border:none;color:#fff;font-size:28px;cursor:pointer}
  </style>
</head>
<body>

<header>
  <h1>💬 Chat en Tiempo Real</h1>
  <span class="badge" id="ws-badge">desconectado</span>
</header>

<div class="auth-bar">
  <input type="text" id="token" placeholder="accessToken JWT..." oninput="localStorage.setItem('io_token',this.value)"/>
  <input type="text" id="refresh-token" placeholder="refreshToken JWT..." oninput="localStorage.setItem('io_refresh_token',this.value)" style="flex:1;min-width:160px;background:#1a1d27;border:1px solid #2a2d3a;color:#e2e8f0;padding:7px 12px;border-radius:6px;font-size:12px"/>
  <button class="btn btn-green" onclick="connect()">Conectar</button>
  <button class="btn btn-gray" onclick="loadRooms()">↺ Salas</button>
</div>

<main>
  <div class="rooms-panel">
    <div class="panel-header"><span>Salas</span></div>
    <div class="room-list" id="room-list">
      <div style="padding:20px;font-size:12px;color:#64748b;text-align:center">Conecta tu token</div>
    </div>
    <div class="new-room-form">
      <input type="text" id="room-participants" placeholder="IDs de participantes (coma)" />
      <input type="text" id="room-name" placeholder="Nombre de sala (opcional)" />
      <button class="btn btn-green" style="width:100%;margin-top:0" onclick="createRoom()">+ Crear sala</button>
    </div>
  </div>

  <div class="chat-panel">
    <div class="chat-header" style="display:flex;justify-content:space-between;align-items:center">
      <div>
        <div class="chat-header-name" id="room-title">Selecciona una sala</div>
        <div class="chat-header-id" id="room-id-display"></div>
      </div>
      <div class="date-jump" id="date-jump" style="display:none">
        <input type="date" id="date-input" onchange="jumpToDate(this.value)" style="position:absolute;opacity:0;pointer-events:none;width:0;height:0"/>
        <button class="btn btn-gray" style="font-size:12px;padding:5px 10px" onclick="document.getElementById('date-input').showPicker()">📅 Ir a fecha</button>
      </div>
    </div>
    <div id="messages">
      <div class="scroll-loader" id="scroll-loader"><span></span><span></span><span></span></div>
      <div class="empty-chat">Selecciona o crea una sala para chatear</div>
      <button id="load-newer-btn" class="btn btn-gray" style="display:none;margin:8px auto;font-size:12px" onclick="loadNewer()">↓ Mensajes más recientes</button>
      <div class="typing-bubble" id="typing-bubble">
        <div class="typing-who" id="typing-who"></div>
        <div class="typing-dots"><span></span><span></span><span></span></div>
      </div>
    </div>
    <div class="input-area">
      <div class="file-preview-bar" id="file-preview"></div>
      <div id="voice-preview" style="display:none" class="voice-preview">
        🎙 <audio id="voice-audio" controls></audio>
        <button onclick="discardVoice()" title="Descartar">✕</button>
        <button class="send-btn" style="padding:5px 12px" onclick="sendVoiceNote()">Enviar</button>
      </div>
      <div class="input-row">
        <button class="attach-btn" onclick="document.getElementById('file-attach').click()" title="Adjuntar">📎</button>
        <input type="file" id="file-attach" multiple accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.odt,.ods,.zip" style="display:none" onchange="addAttachments(this.files)"/>
        <input type="text" id="msg-input" placeholder="Escribe un mensaje..." onkeydown="if(event.key==='Enter')sendMessage()" oninput="onTyping()"/>
        <button class="mic-btn" id="mic-btn" onclick="toggleRecording()" title="Nota de voz">🎙</button>
        <button class="send-btn" onclick="sendMessage()">Enviar</button>
      </div>
    </div>
  </div>
</main>

<div id="toast"></div>
<div id="lightbox"><button id="lightbox-close" onclick="closeLightbox()">✕</button><img id="lightbox-img" src=""/></div>

<script>
  const API = '/api/v1';
  let socket = null;
  let myUserId = null;
  let currentRoom = null;
  let attachments = [];

  // Restaurar tokens guardados y auto-conectar
  const saved = localStorage.getItem('io_token');
  const savedRt = localStorage.getItem('io_refresh_token');
  if (saved) document.getElementById('token').value = saved;
  if (savedRt) document.getElementById('refresh-token').value = savedRt;
  if (saved) window.addEventListener('load', () => connect());

  const token = () => document.getElementById('token').value.trim();
  const authHeaders = () => ({ 'Authorization': `Bearer ${token()}`, 'Content-Type': 'application/json' });

  function tokenExpired(tk) {
    try {
      const { exp } = JSON.parse(atob(tk.split('.')[1]));
      return Date.now() / 1000 >= exp - 30; // 30s de margen
    } catch { return true; }
  }

  async function ensureFreshToken() {
    if (!token() || !tokenExpired(token())) return true;
    const rt = localStorage.getItem('io_refresh_token');
    if (!rt) { toast('Sesión expirada, pega tu token', false); return false; }
    const res = await fetch(`${API}/auth/refresh`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ refreshToken: rt }),
    });
    if (!res.ok) { toast('Sesión expirada', false); return false; }
    const json = await res.json();
    document.getElementById('token').value = json.data.accessToken;
    localStorage.setItem('io_token', json.data.accessToken);
    localStorage.setItem('io_refresh_token', json.data.refreshToken);
    // Reconectar socket con nuevo token
    if (socket?.connected) {
      socket.auth = { token: json.data.accessToken };
      socket.disconnect().connect();
    }
    return true;
  }

  function toast(msg, ok = true) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = ok ? 'ok' : 'err'; t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 3000);
  }

  // ── WebSocket ──────────────────────────────────────────────
  function connect() {
    if (!token()) return toast('Pega tu token primero', false);
    if (socket?.connected) return toast('Ya conectado');
    try {
      myUserId = JSON.parse(atob(token().split('.')[1])).userId;
    } catch { return toast('Token inválido', false); }

    socket = io(window.location.origin, { auth: { token: token() }, transports: ['websocket'] });

    socket.on('connect', () => {
      document.getElementById('ws-badge').textContent = 'conectado';
      document.getElementById('ws-badge').className = 'badge online';
      toast('WebSocket conectado');
      loadRooms();
    });

    socket.on('disconnect', () => {
      document.getElementById('ws-badge').textContent = 'desconectado';
      document.getElementById('ws-badge').className = 'badge';
    });

    socket.on('chat:message', (msg) => {
      if (currentRoom && msg.roomId === currentRoom.id) {
        appendMessage(msg);
        // Si el mensaje es de otro y estoy en la sala → marcar leído automáticamente
        if (msg.senderId !== myUserId) {
          socket.emit('chat:open-room', { roomId: currentRoom.id });
        }
      }
      loadRooms();
    });

    // Typing indicator — burbuja animada
    socket.on('chat:typing', ({ roomId, typing }) => {
      if (currentRoom?.id !== roomId) return;
      showTypingBubble(typing);
    });

    // Cuando alguien lee → actualizar ticks + recargar badge de salas
    socket.on('chat:read', ({ roomId, userId }) => {
      if (userId === myUserId) {
        // Yo abrí una sala → recargar lista para limpiar el badge
        loadRooms();
        return;
      }
      if (currentRoom?.id !== roomId) return;
      // El otro leyó → poner ticks verdes en mis mensajes
      document.querySelectorAll('.msg.mine .tick').forEach(el => {
        el.textContent = '✓✓';
        el.className = 'tick read';
      });
    });
  }

  // ── Salas ──────────────────────────────────────────────────
  async function loadRooms() {
    if (!token()) return;
    if (!await ensureFreshToken()) return;
    const res = await fetch(`${API}/chat/rooms?limit=50`, { headers: authHeaders() });
    if (!res.ok) return;
    const json = await res.json();
    renderRooms(json.data || []);
  }

  function roomDisplayName(r) {
    return r.name || r.participants?.filter(p => p.userId !== myUserId)
      .map(p => `${p.user.firstName} ${p.user.lastName}`).join(', ') || 'Sala';
  }

  function renderRooms(rooms) {
    const list = document.getElementById('room-list');
    if (!rooms.length) {
      list.innerHTML = '<div style="padding:20px;font-size:12px;color:#64748b;text-align:center">Sin salas aún</div>';
      return;
    }
    list.innerHTML = rooms.map(r => {
      const lastMsg = r.messages?.[0];
      const preview = lastMsg?.content || (lastMsg?.media?.length ? '📎 Archivo' : 'Sin mensajes');
      const badge = r.unread > 0 ? `<span class="unread-badge">${r.unread > 99 ? '99+' : r.unread}</span>` : '';
      return `<div class="room-item${currentRoom?.id === r.id ? ' active' : ''}"
        onclick='openRoom(${JSON.stringify(r).replace(/'/g,"&#39;")})'>
        <div class="room-item-row">
          <div class="room-name">${escHtml(roomDisplayName(r))}</div>
          ${badge}
        </div>
        <div class="room-preview">${escHtml(preview)}</div>
      </div>`;
    }).join('');
  }

  async function createRoom() {
    const raw = document.getElementById('room-participants').value.trim();
    const name = document.getElementById('room-name').value.trim();
    if (!raw) return toast('Ingresa al menos un ID de participante', false);
    const participantIds = raw.split(',').map(s => s.trim()).filter(Boolean);
    const res = await fetch(`${API}/chat/rooms`, {
      method: 'POST', headers: authHeaders(),
      body: JSON.stringify({ participantIds, ...(name && { name }) }),
    });
    const json = await res.json();
    if (!res.ok) return toast(`Error: ${json.code}`, false);
    toast('Sala creada');
    document.getElementById('room-participants').value = '';
    document.getElementById('room-name').value = '';
    loadRooms();
  }

  let pageOld = 1;
  let pageNew = 0;
  let totalPages = 1;
  let msgLoading = false;
  let userScrolled = false;  // evita consumir páginas antes de que el usuario scrollee

  function clearMessages() {
    const container = document.getElementById('messages');
    const bubble = document.getElementById('typing-bubble');
    const loader = document.getElementById('scroll-loader');
    const newerBtn = document.getElementById('load-newer-btn');
    loader.classList.remove('visible');
    newerBtn.style.display = 'none';
    container.innerHTML = '';
    container.appendChild(loader);
    container.appendChild(newerBtn);
    container.appendChild(bubble);
  }

  async function openRoom(room) {
    currentRoom = room;
    msgLoading = false;
    showTypingBubble(false);
    document.getElementById('room-title').textContent = roomDisplayName(room);
    document.getElementById('room-id-display').textContent = `ID: ${room.id}`;
    document.getElementById('date-jump').style.display = 'flex';
    document.getElementById('date-input').value = '';
    loadRooms();
    userScrolled = false;
    clearMessages();

    // Cargar página 1 (más recientes) y scroll al fondo
    const meta = await fetchAndRender(room.id, 1, 'append');
    if (meta) {
      pageOld = 2;          // siguiente hacia arriba
      pageNew = 0;          // ya estamos al fondo, no hay más recientes
      totalPages = meta.totalPages;
    }
    requestAnimationFrame(() => {
      const c = document.getElementById('messages');
      c.scrollTop = c.scrollHeight;
    });

    if (socket?.connected) socket.emit('chat:open-room', { roomId: room.id });
  }

  async function jumpToDate(dateStr) {
    if (!dateStr || !currentRoom) return;
    msgLoading = false;
    userScrolled = false;
    clearMessages();

    const meta = await fetchAndRender(currentRoom.id, 1, 'append', dateStr);
    if (!meta) return;

    pageOld = meta.page + 1;
    pageNew = meta.page - 1;
    totalPages = meta.totalPages;

    // Mostrar botón si hay páginas más recientes
    const newerBtn = document.getElementById('load-newer-btn');
    newerBtn.style.display = pageNew >= 1 ? 'block' : 'none';

    // Centrar scroll en los mensajes de esa fecha
    const container = document.getElementById('messages');
    const target = container.querySelector(`[data-date="${dateStr}"]`);
    if (target) target.scrollIntoView({ block: 'center' });
    else container.scrollTop = container.scrollHeight / 2;
  }

  async function loadNewer() {
    if (pageNew < 1) { document.getElementById('load-newer-btn').style.display = 'none'; return; }
    const targetPage = pageNew;
    pageNew--;
    const meta = await fetchAndRender(currentRoom.id, targetPage, 'append');
    if (!meta) { pageNew++; return; }
    if (pageNew < 1) document.getElementById('load-newer-btn').style.display = 'none';
    const container = document.getElementById('messages');
    container.scrollTop = container.scrollHeight;
  }

  // Scroll infinito en ambas direcciones
  document.getElementById('messages').addEventListener('scroll', async function() {
    userScrolled = true;
    if (msgLoading || !currentRoom) return;
    const atTop = this.scrollTop < 80;
    const atBottom = this.scrollHeight - this.scrollTop - this.clientHeight < 80;

    if (atTop && pageOld <= totalPages) {
      const targetPage = pageOld;
      pageOld++;
      const prevH = this.scrollHeight;
      const meta = await fetchAndRender(currentRoom.id, targetPage, 'prepend');
      if (!meta) { pageOld--; }
      else { this.scrollTop += this.scrollHeight - prevH; }
    } else if (atBottom && pageNew >= 1 && userScrolled) {
      const targetPage = pageNew;
      pageNew--;
      const meta = await fetchAndRender(currentRoom.id, targetPage, 'append');
      if (!meta) { pageNew++; }
      else if (pageNew < 1) document.getElementById('load-newer-btn').style.display = 'none';
    }
  });

  async function fetchAndRender(roomId, page, mode, date = null) {
    if (!await ensureFreshToken()) return null;
    msgLoading = true;
    const loader = document.getElementById('scroll-loader');
    if (mode === 'prepend') loader.classList.add('visible');

    const params = new URLSearchParams({ page, limit: 8 });
    if (date) params.set('date', date);
    const res = await fetch(`${API}/chat/rooms/${roomId}/messages?${params}`, { headers: authHeaders() });
    const json = await res.json();
    loader.classList.remove('visible');
    msgLoading = false;
    if (!res.ok) { toast(`Error: ${json.code}`, false); return null; }

    const container = document.getElementById('messages');
    if (!json.data.length && page === 1) {
      container.insertAdjacentHTML('afterbegin', '<div class="empty-chat">Sin mensajes aún. ¡Escribe el primero!</div>');
      return json.meta;
    }

    if (mode === 'prepend') {
      const anchor = container.querySelector('.msg, .date-sep');
      appendMessagesWithSeparators(json.data, true, anchor);
    } else {
      appendMessagesWithSeparators(json.data, false, null);
    }

    return json.meta;
  }

  function formatDateLabel(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    const today = new Date(); today.setHours(0,0,0,0);
    const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
    d.setHours(0,0,0,0);
    if (d.getTime() === today.getTime()) return 'Hoy';
    if (d.getTime() === yesterday.getTime()) return 'Ayer';
    return d.toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  }

  function rebuildDateSeparators() {
    const container = document.getElementById('messages');
    container.querySelectorAll('.date-sep').forEach(el => el.remove());
    // Separador ANTES del primer mensaje de cada día
    container.querySelectorAll('.msg[data-first-of-day="true"]').forEach(msgEl => {
      const sep = document.createElement('div');
      sep.className = 'date-sep';
      sep.dataset.sep = msgEl.dataset.date;
      sep.innerHTML = `<span>${formatDateLabel(msgEl.dataset.date)}</span>`;
      container.insertBefore(sep, msgEl);
    });
  }

  function appendMessagesWithSeparators(msgs, prepend, anchor) {
    const container = document.getElementById('messages');
    const bubble = document.getElementById('typing-bubble');

    if (prepend) {
      // msgs viene en orden asc (viejo→nuevo). Para insertar antes del anchor
      // en orden correcto, insertar cada uno antes del anterior recién insertado.
      // Empezamos por el más nuevo (último) e insertamos antes del anchor,
      // luego cada siguiente va antes del anterior → quedan viejo→nuevo arriba.
      let insertRef = anchor;
      [...msgs].reverse().forEach(msg => {
        if (document.querySelector(`[data-msg-id="${msg.id}"]`)) return;
        const el = buildMessageEl(msg);
        el.dataset.date = new Date(msg.createdAt).toISOString().slice(0, 10);
        el.dataset.firstOfDay = msg.isFirstOfDay ? 'true' : 'false';
        el.classList.add('prepend');
        container.insertBefore(el, insertRef);
        insertRef = el;
      });
    } else {
      msgs.forEach(msg => {
        if (document.querySelector(`[data-msg-id="${msg.id}"]`)) return;
        const el = buildMessageEl(msg);
        el.dataset.date = new Date(msg.createdAt).toISOString().slice(0, 10);
        el.dataset.firstOfDay = msg.isFirstOfDay ? 'true' : 'false';
        container.insertBefore(el, bubble);
      });
    }

    rebuildDateSeparators();
  }

  // ── Mensajes ───────────────────────────────────────────────
  function buildMessageEl(msg) {
    const isMine = msg.senderId === myUserId || msg.sender?.id === myUserId;
    const isRead = msg.receipts?.some(r => r.userId !== myUserId);
    const hasContent = msg.content?.trim();
    const senderName = isMine ? 'Tú' : `${msg.sender?.firstName || ''} ${msg.sender?.lastName || ''}`.trim();
    const time = new Date(msg.createdAt).toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
    const tickHtml = isMine ? `<span class="tick ${isRead ? 'read' : 'delivered'}">${isRead ? '✓✓' : '✓✓'}</span>` : '';
    const images = (msg.media || []).filter(m => m.mimeType?.startsWith('image'));
    const videos = (msg.media || []).filter(m => m.mimeType?.startsWith('video'));
    const audios = (msg.media || []).filter(m => m.mimeType?.startsWith('audio'));
    const docs   = (msg.media || []).filter(m => !m.mimeType?.startsWith('image') && !m.mimeType?.startsWith('video') && !m.mimeType?.startsWith('audio'));
    const mediaHtml = [
      images.length ? `<div class="msg-media">${images.map(m => `<img src="${m.url||''}" alt="img" onclick="openLightbox('${m.url||''}')" onerror="this.style.opacity='.3'">`).join('')}</div>` : '',
      videos.length ? `<div class="msg-media">${videos.map(m => `<video src="${m.url||''}" controls></video>`).join('')}</div>` : '',
      audios.length ? `<div class="msg-audio">${audios.map(m => `<audio src="${m.url||''}" controls></audio>`).join('')}</div>` : '',
      docs.length   ? `<div class="msg-docs">${docs.map(m => `<a class="msg-doc" href="${m.url||''}" target="_blank" download><span class="msg-doc-icon">${docIcon(m.mimeType)}</span><span class="msg-doc-name">${escHtml(m.storageKey?.split('/').pop()||'archivo')}</span><span class="msg-doc-size">${formatSize(m.size)}</span></a>`).join('')}</div>` : '',
    ].join('');
    const el = document.createElement('div');
    el.className = `msg ${isMine ? 'mine' : 'theirs'}`;
    el.dataset.msgId = msg.id;
    el.innerHTML = `
      <div class="msg-sender">${escHtml(senderName)}</div>
      ${hasContent ? `<div class="msg-bubble">${escHtml(msg.content)}</div>` : ''}
      ${mediaHtml}
      <div class="msg-footer">${time}${tickHtml}</div>`;
    return el;
  }

  function appendMessage(msg) {
    const container = document.getElementById('messages');
    container.querySelector('.empty-chat')?.remove();
    if (document.querySelector(`[data-msg-id="${msg.id}"]`)) return;
    const dateStr = new Date(msg.createdAt).toISOString().slice(0, 10);
    // Es primero del día si no hay ningún mensaje de ese día ya en pantalla
    const isFirstOfDay = !container.querySelector(`.msg[data-date="${dateStr}"]`);
    const el = buildMessageEl(msg);
    el.dataset.date = dateStr;
    el.dataset.firstOfDay = isFirstOfDay ? 'true' : 'false';
    container.insertBefore(el, document.getElementById('typing-bubble'));
    rebuildDateSeparators();
  }

  // ── Envío ──────────────────────────────────────────────────
  async function sendMessage() {
    if (!currentRoom) return toast('Selecciona una sala', false);
    const input = document.getElementById('msg-input');
    const content = input.value.trim();
    if (!content && !attachments.length) return;

    if (attachments.length) {
      // Texto + archivos en un solo mensaje
      const fd = new FormData();
      if (content) fd.append('content', content);
      attachments.forEach(f => fd.append('files', f));
      const res = await fetch(`${API}/chat/rooms/${currentRoom.id}/messages/media`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token()}` },
        body: fd,
      });
      if (!res.ok) { const j = await res.json(); return toast(`Error: ${j.code}`, false); }
      attachments = []; renderAttachments();
    } else {
      // Solo texto
      const res = await fetch(`${API}/chat/rooms/${currentRoom.id}/messages`, {
        method: 'POST', headers: authHeaders(),
        body: JSON.stringify({ content }),
      });
      if (!res.ok) { const j = await res.json(); return toast(`Error: ${j.code}`, false); }
    }

    input.value = '';
    // Cancelar typing al enviar
    if (socket?.connected && currentRoom) {
      clearTimeout(typingTimeout);
      socket.emit('chat:typing', { roomId: currentRoom.id, typing: false });
    }
  }

  function addAttachments(files) {
    for (const f of files) attachments.push(f);
    renderAttachments();
    document.getElementById('file-attach').value = '';
  }

  function renderAttachments() {
    document.getElementById('file-preview').innerHTML = attachments.map((f, i) =>
      `<div class="file-chip">${escHtml(f.name)}<button onclick="removeAttachment(${i})">✕</button></div>`
    ).join('');
  }

  function removeAttachment(i) { attachments.splice(i, 1); renderAttachments(); }

  // ── Utilidades ─────────────────────────────────────────────
  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Typing indicator ───────────────────────────────────────
  let typingHideTimer = null;
  function showTypingBubble(visible) {
    clearTimeout(typingHideTimer);
    const bubble = document.getElementById('typing-bubble');
    if (!visible) {
      bubble.classList.remove('visible');
      return;
    }
    // Solo animar desde cero si no estaba ya visible
    if (!bubble.classList.contains('visible')) {
      const container = document.getElementById('messages');
      container.appendChild(bubble);
      bubble.classList.add('visible');
      container.scrollTop = container.scrollHeight;
    }
    // Siempre resetear el timer de auto-ocultar
    typingHideTimer = setTimeout(() => bubble.classList.remove('visible'), 4000);
  }

  let typingTimeout = null;
  function onTyping() {
    if (!socket?.connected || !currentRoom) return;
    socket.emit('chat:typing', { roomId: currentRoom.id, typing: true });
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => {
      socket.emit('chat:typing', { roomId: currentRoom.id, typing: false });
    }, 2000);
  }

  function docIcon(mime) {
    if (!mime) return '📄';
    if (mime.includes('pdf'))         return '📕';
    if (mime.includes('word') || mime.includes('opendocument.text')) return '📝';
    if (mime.includes('excel') || mime.includes('spreadsheet') || mime.includes('csv')) return '📊';
    if (mime.includes('powerpoint') || mime.includes('presentation')) return '📽';
    if (mime.includes('zip'))         return '🗜';
    if (mime.includes('text'))        return '📃';
    return '📄';
  }

  function formatSize(bytes) {
    if (!bytes) return '';
    if (bytes < 1024) return `${bytes} B`;
    if (bytes < 1024 * 1024) return `${(bytes/1024).toFixed(1)} KB`;
    return `${(bytes/1024/1024).toFixed(1)} MB`;
  }

  function openLightbox(url) {
    document.getElementById('lightbox-img').src = url;
    document.getElementById('lightbox').classList.add('open');
  }
  function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); }
  document.getElementById('lightbox').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeLightbox();
  });

  // ── Notas de voz ───────────────────────────────────────────
  let mediaRecorder = null;
  let audioChunks = [];
  let voiceBlob = null;

  async function toggleRecording() {
    if (mediaRecorder?.state === 'recording') {
      mediaRecorder.stop();
      return;
    }

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/ogg';
      mediaRecorder = new MediaRecorder(stream, { mimeType });
      audioChunks = [];

      mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };

      mediaRecorder.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        voiceBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
        const url = URL.createObjectURL(voiceBlob);
        document.getElementById('voice-audio').src = url;
        document.getElementById('voice-preview').style.display = 'flex';
        document.getElementById('mic-btn').classList.remove('recording');
        document.getElementById('mic-btn').title = 'Nota de voz';
      };

      mediaRecorder.start();
      document.getElementById('mic-btn').classList.add('recording');
      document.getElementById('mic-btn').title = 'Detener grabación';
    } catch {
      toast('No se pudo acceder al micrófono', false);
    }
  }

  function discardVoice() {
    voiceBlob = null;
    audioChunks = [];
    document.getElementById('voice-audio').src = '';
    document.getElementById('voice-preview').style.display = 'none';
  }

  async function sendVoiceNote() {
    if (!voiceBlob || !currentRoom) return;
    const ext = voiceBlob.type.includes('webm') ? 'webm' : 'ogg';
    const fd = new FormData();
    fd.append('audio', voiceBlob, `voice-note.${ext}`);
    const res = await fetch(`${API}/chat/rooms/${currentRoom.id}/messages/voice`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token()}` },
      body: fd,
    });
    if (!res.ok) { const j = await res.json(); return toast(`Error: ${j.code}`, false); }
    discardVoice();
  }
</script>
